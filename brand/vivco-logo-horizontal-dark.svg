<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220">
  <title>Vivco — Logo Horizontal Dark</title>
  <desc>Logo horizontal para fondos oscuros: teal-500, teal-700, charcoal, fotografías oscuras. Wordmark en sand-100.</desc>

  <!-- Logo mark (symbol sin background rect — usa el fondo del contexto) -->
  <g transform="translate(10, 10) scale(0.39)">
    <!-- Roof — coral-300 visible sobre oscuro -->
    <path d="M 136 218 L 256 110 L 376 218"
          stroke="#FDBA74"
          stroke-width="30"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
    <!-- V — coral-500 -->
    <path d="M 140 222 L 256 408 L 372 222"
          stroke="#F97316"
          stroke-width="44"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </g>

  <!-- Wordmark "vivco" — sand-100 sobre oscuro -->
  <text x="240" y="145"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="120"
        font-weight="700"
        letter-spacing="-3"
        fill="#FDF8F3">vivco</text>
</svg>
